# 采集源。type 决定用哪个解析器：
#   rss   = 标准 RSS/Atom
#   pinguan = 品观网 /media/ 的 cov-card 卡片（含 JSON-LD，但日期在 DOM）
#   jumeili = 聚美丽列表（相对时间，需进详情页补日期）
#   qingyan = 青眼首页（标题 + 绝对日期 + Details.aspx?id=）
#   mzt     = 美妆头条列表（article-library-card）
#   winshang= 赢商网列表（win-new-list1，带"开关店/品牌/选址"标签）
#   linkshop= 联商网（gb2312 页面）
#   cnpharm = 中国食品药品网 /hzp/（监管动态）
#   sogou   = 搜狗微信搜索（只有标题+摘要，弱信号）
#
# tier 影响打分：core（国际权威）/ trade（行业媒体）/ channel（渠道媒体）/ reg（监管）/ weak（弱信号）


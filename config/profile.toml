# 美妆情报 · 范围与栏目
# 读者：品牌市场部高管（大众护肤 / 医美械字号）
# 目标：每天 3 分钟扫完，知道竞品在动什么、渠道在变什么

[delivery]
title = "美妆情报"
time = "07:30"              # 北京时间，汇总前一天的内容
timezone = "Asia/Shanghai"
max_items = 10
min_items = 6
web_base = "https://dtjdgb0506.github.io/beauty-brief"               # 有静态托管地址后填，邮件里的"看详细"会用它拼绝对链接
fresh_days = 4              # 中文日更源只收最近 N 天发布的稿子（国际低频源自动放宽到 14 天）
dedupe_hours = 72           # 同一标题在 N 小时内不重复出现

[scope]
category = "大众护肤 / 医美械字号"
price_band = "单品 50~300 元"
one_liner = "大众护肤与医美械字号品牌的竞品动作、线下零售与代理渠道动态"


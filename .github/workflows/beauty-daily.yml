name: beauty-brief

# 每天北京时间 07:30 汇总前一天的公开信息，发邮件 + 发布详情页到 GitHub Pages。
# 跑在 GitHub 服务器上，电脑关不关机都不影响。
# Secrets：MAIL_SMTP_HOST / MAIL_SMTP_PORT / MAIL_USER / MAIL_PASS /
#          MAIL_FROM / MAIL_FROM_NAME / MAIL_TO / LLM_BASE_URL / LLM_MODEL / LLM_API_KEY

on:
  schedule:
    - cron: "30 23 * * *"     # UTC 23:30 = 北京 07:30
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run (no email, no state commit)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: beauty-brief
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONIOENCODING: utf-8

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: write env file
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          printf 'MAIL_SMTP_HOST=%s\n' "$MAIL_SMTP_HOST" > .env
          printf 'MAIL_SMTP_PORT=%s\n' "$MAIL_SMTP_PORT" >> .env
          printf 'MAIL_USER=%s\n' "$MAIL_USER" >> .env
          printf 'MAIL_PASS=%s\n' "$MAIL_PASS" >> .env
          printf 'MAIL_FROM=%s\n' "$MAIL_FROM" >> .env
          printf 'MAIL_FROM_NAME=%s\n' "$MAIL_FROM_NAME" >> .env
          printf 'MAIL_TO=%s\n' "$MAIL_TO" >> .env
          printf 'LLM_BASE_URL=%s\n' "$LLM_BASE_URL" >> .env
          printf 'LLM_MODEL=%s\n' "$LLM_MODEL" >> .env
          printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY" >> .env
          echo "env file written"

      - name: collect sources
        continue-on-error: true
        run: python scripts/collect.py

      - name: score enrich render send
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/run_daily.py --no-collect --dry-run
          else
            python scripts/run_daily.py --no-collect
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: notify failure
        if: failure()
        run: python scripts/notify_failure.py

      - name: commit state and site
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "beauty-brief-bot"
          git config user.email "beauty-brief-bot@users.noreply.github.com"
          git add site state 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%F) [skip ci]"
            git push
          else
            echo "no state change"
          fi
